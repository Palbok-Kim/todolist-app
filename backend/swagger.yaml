paths:
  /auth/signup:
    post:
      tags: [auth]
      operationId: signUp
      summary: 회원가입 (자동 로그인)
      description: |
        회원가입 후 로그인과 같이 액세스·리프레시·CSRF 쿠키를 발급해 자동 로그인한다(NFR-07 (5)).
        User + 기본 카테고리 + 리프레시 토큰 행을 한 트랜잭션으로 만든다(BR-03, DL-08, AQ-12).
        - 인증·CSRF 대상이 아니다(NFR-15, DL-05). 요청 횟수 제한 없음(R-11).
        - email은 소문자로 정규화해 저장하고 대소문자 무시로 중복 검사한다(VR-01). 중복은 409.
        - `timezone`이 없거나 VR-04를 통과하지 못하면 오류 없이 `Asia/Seoul`로 저장한다(PRD 4.2, 가입 때만).
        - 응답 본문은 사용자 정보이고 `passwordHash`는 없다(PRD 11장 현재 사용자 조회).

        경로는 가정 (설계서 COM-01에서 확정). 근거: FR-01, UC-01, AC-01, BR-03, VR-01~04, NFR-06, NFR-07, NFR-15, AD-06, BE-12.
      x-priority: P0
      x-source-ids: [FR-01, UC-01, AC-01, BR-03, VR-01, VR-02, VR-03, VR-04, NFR-06, NFR-07, NFR-15, ERR-01, ERR-04, OI-10, R-11, AD-06, AQ-12, BE-12]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
            examples:
              signUp:
                value:
                  email: a@example.com
                  password: correct horse battery
                  name: 김민수
                  timezone: Asia/Seoul
      responses:
        '201':
          description: 가입 성공. 세션 쿠키 3종을 발급한다.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieSession'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                created:
                  $ref: '#/components/examples/UserExample'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/login:
    post:
      tags: [auth]
      operationId: logIn
      summary: 로그인
      description: |
        처리 순서(AD-07): 입력 형식 검사 → 로그인 제한 확인 → 사용자 조회·비밀번호 비교 → 세션 발급.
        - 형식 검사(PRD 4.1 로그인 입력 검증): email 필수·형식·254자, 비밀번호 필수·128자 이하. 위반은 400이고 실패 횟수에 넣지 않는다. VR-02의 길이 하한·문자 종류 규칙은 적용하지 않는다(AQ-04).
        - IP별(15분 10회)·계정별(15분 5회) 실패가 한도에 이르면 다음 시도부터 429. 제한 중에는 비밀번호를 검증하지 않으므로 올바른 비밀번호도 거부된다(NFR-10, AC-15). 수치는 가정.
        - 없는 email과 틀린 비밀번호는 같은 401 `INVALID_CREDENTIALS`와 같은 문구다(ERR-03, AC-14).
        - 성공하면 새 계열의 리프레시 토큰을 발급하고 그 사용자의 만료 행을 정리한다(OI-21). 성공은 실패 횟수에 넣지 않는다.
        - 인증·CSRF 대상이 아니다(NFR-15).

        경로는 가정 (설계서 COM-01에서 확정). 근거: FR-01, UC-02, AC-14, AC-15, NFR-07, NFR-10, NFR-16, AD-07, BE-13.
      x-priority: P0
      x-source-ids: [FR-01, UC-02, AC-14, AC-15, BR-16, NFR-06, NFR-07, NFR-10, NFR-15, NFR-16, ERR-01, ERR-03, ERR-06, AQ-04, OI-21, AD-07, BE-13]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              login:
                value:
                  email: a@example.com
                  password: correct horse battery
      responses:
        '200':
          description: 로그인 성공. 세션 쿠키 3종을 발급한다.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieSession'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                ok:
                  $ref: '#/components/examples/UserExample'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      tags: [auth]
      operationId: logOut
      summary: 로그아웃
      description: |
        토큰이 없거나 만료돼도 항상 성공하고 액세스·리프레시·CSRF 쿠키를 모두 삭제한다(BR-01, AC-16).
        리프레시 쿠키가 있으면 그 토큰 계열을 서버에서 폐기한다. 폐기에 실패해도 서버 로그만 남기고 쿠키는 지우며 성공으로 응답한다.
        - 공개 라우트이고 CSRF 대상이 아니다(NFR-15, DL-05). 강제 로그아웃 CSRF는 수용한다.
        - 잔여 위험: 액세스 토큰은 서버가 즉시 무효화하지 않으므로 탈취된 경우 만료(최대 15분) 전까지 쓰일 수 있다(R-08).

        경로는 가정 (설계서 COM-01에서 확정). 근거: UC-02, BR-01, BR-16, AC-16, NFR-07, NFR-15, AD-13, BE-13.
      x-priority: P0
      x-source-ids: [FR-01, UC-02, BR-01, BR-16, AC-16, NFR-07, NFR-15, R-08, AD-13, BE-13]
      security:
        - refreshTokenCookie: []
        - {}
      responses:
        '200':
          description: 항상 성공. 세 쿠키를 삭제한다.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieClear'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
              examples:
                ok:
                  $ref: '#/components/examples/OkExample'

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: 토큰 갱신 (리프레시 토큰 회전)
      description: |
        액세스 토큰 없이 리프레시 쿠키만으로 호출한다. 인증 미들웨어 앞의 공개 라우트이고 CSRF 대상이 아니다(NFR-07 (4), NFR-15, DL-05).
        - 성공: 이전 리프레시 토큰을 폐기하고 같은 계열의 새 토큰(만료 지금부터 7일)과 새 액세스 토큰, 새 `jti`에 묶은 새 CSRF 토큰을 쿠키로 발급한다(BR-16, OI-18). 응답 본문에는 토큰을 넣지 않는다.
        - 401 `UNAUTHORIZED`(ERR-02): 쿠키 없음, 모르는 값, 만료, 폐기. 회전으로 폐기된 지 10초(설정값) 이내의 값은 계열을 유지한 채 거부만 하고, 10초를 넘긴 값은 재사용으로 보고 계열 전체를 폐기한 뒤 거부한다(OI-20, AC-24). 실패 응답에서 리프레시 쿠키는 지우지 않는다(AD-14).
        - 같은 값의 동시 갱신은 하나만 성공하고 나머지는 401이다. 클라이언트는 갱신 요청 자체를 재시도하지 않는다(DL-14).
        - 로그인 실패 제한(NFR-10) 대상이 아니다.

        경로는 가정 (설계서 COM-01에서 확정). 근거: UC-02, BR-16, AC-22, AC-23, AC-24, NFR-07, NFR-15, OI-18~OI-20, AD-14, BE-24.
      x-priority: P0
      x-source-ids: [FR-01, UC-02, BR-16, AC-22, AC-23, AC-24, NFR-07, NFR-15, OI-18, OI-19, OI-20, R-14, AD-14, AQ-11, AQ-13, BE-24]
      security:
        - refreshTokenCookie: []
      responses:
        '200':
          description: 갱신 성공. 세 쿠키를 새 값으로 재발급한다.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieSession'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
              examples:
                ok:
                  $ref: '#/components/examples/OkExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/me:
    get:
      tags: [users]
      operationId: getCurrentUser
      summary: 현재 사용자 조회
      description: |
        프런트의 인증 여부 판정(`RequireAuth`)과 name·email·timezone 읽기용이다(PRD 11장, AQ-03). 인증 실패는 401.

        경로는 가정 (설계서 COM-01에서 확정). 근거: FR-01, FR-03, PRD 4.2, PRD 11장, AQ-03, BE-15.
      x-priority: P0
      x-source-ids: [FR-01, FR-03, UC-03, AQ-03, DL-06, BE-15]
      responses:
        '200':
          description: 현재 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                me:
                  $ref: '#/components/examples/UserExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [users]
      operationId: updateCurrentUser
      summary: 내 정보 수정 (시간대 P0, name P1)
      description: |
        보낸 필드만 바꾼다. email은 바꿀 수 없다(OI-03).
        - `timezone`(P0, AC-13): VR-04를 통과하지 못하면 대체하지 않고 400(PRD 4.2). 오프셋 형식(`+09:00`) 거부, `UTC` 허용, 정규형으로 저장(PQ-06). 바꾸면 이후 오늘·상태 판정이 새 시간대 기준이며 할일 날짜 값은 바뀌지 않는다(AD-12).
        - `name`(P1, AC-19): VR-03. 컷 라인 1에 따라 빠지면 이 필드를 보내도 400으로 거부한다(가정).
        - 클라이언트는 성공 뒤 사용자·할일 목록·캘린더 쿼리를 무효화한다(DL-12).

        경로·메서드는 가정 (설계서 COM-01에서 확정). 근거: FR-03, UC-03, AC-13, AC-19, VR-03, VR-04, PRD 4.2, AD-12, BE-15, BE-23.
      x-priority: P0
      x-source-ids: [FR-03, UC-03, AC-13, AC-19, BR-15, VR-03, VR-04, OI-03, PQ-06, AD-12, BE-15, BE-23]
      security:
        - accessTokenCookie: []
          csrfCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            examples:
              timezone:
                summary: 시간대 변경 (P0)
                value:
                  timezone: UTC
              name:
                summary: name 변경 (P1)
                value:
                  name: 김민지
      responses:
        '200':
          description: 수정된 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                updated:
                  value:
                    id: 3f2b8c1e-9a4d-4b7e-8f21-6c5d4e3a2b10
                    email: a@example.com
                    name: 김민수
                    timezone: UTC
                    createdAt: '2026-11-03T09:00:00.000Z'
                    updatedAt: '2026-11-04T05:10:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfFailed'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/me/password:
    put:
      tags: [users]
      operationId: changePassword
      summary: 비밀번호 변경 (P1)
      description: |
        PRD 4.4. FR-03의 P1 부분이며 컷 라인 1에서 가장 먼저 빠진다(PRD 8장).
        - 현재 비밀번호가 틀리면 400 `VALIDATION_ERROR`이고 `fields`의 필드는 `currentPassword`다(AC-21). 이 실패는 로그인 실패 횟수에 넣지 않는다.
        - 새 비밀번호는 VR-02(`Password` 스키마). 두 값 모두 공백을 제거하지 않는다.
        - 성공하면 그 사용자의 모든 리프레시 토큰을 폐기하고 현재 세션에 새 액세스·리프레시·CSRF 쿠키를 발급해 현재 기기의 로그인을 유지한다(AC-20, BR-16). 다른 기기는 액세스 토큰 만료(최대 15분) 뒤 로그인을 요구받는다(R-08).

        경로·메서드는 가정 (설계서 COM-01에서 확정). 근거: FR-03, UC-03, AC-20, AC-21, PRD 4.4, VR-02, NFR-06, BR-16, BE-23.
      x-priority: P1
      x-source-ids: [FR-03, UC-03, AC-20, AC-21, OI-03, VR-02, NFR-06, NFR-07, BR-16, R-08, BE-23]
      security:
        - accessTokenCookie: []
          csrfCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            examples:
              change:
                value:
                  currentPassword: correct horse battery
                  newPassword: 'new  passphrase with spaces '
      responses:
        '200':
          description: 변경 성공. 현재 세션에 새 쿠키 3종을 발급한다.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieSession'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
              examples:
                ok:
                  $ref: '#/components/examples/OkExample'
        '400':
          description: 입력 검증 실패 또는 현재 비밀번호 불일치 (ERR-01)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                wrongCurrent:
                  summary: 현재 비밀번호 불일치 (AC-21)
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: 입력값을 확인해 주세요.
