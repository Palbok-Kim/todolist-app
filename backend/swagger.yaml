          in: query
          required: true
          description: 조회 종료일 (YYYY-MM-DD, 포함). `from` 이상, 양 끝 포함 42일 이하.
          schema:
            $ref: '#/components/schemas/DateString'
          example: '2026-12-06'
      responses:
        '200':
          description: 기간과 겹치는 할일 (status 포함, 목록과 같은 정렬)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoList'
              examples:
                month:
                  value:
                    items:
                      - id: 9c8b7a6f-5e4d-4c3b-a2f1-e0d9c8b7a6f5
                        categoryId: 5a1c2d3e-4f50-4617-8a9b-0c1d2e3f4a5b
                        title: 기획서 초안 작성
                        description: null
                        startDate: '2026-11-03'
                        endDate: '2026-11-05'
                        completed: false
                        completedAt: null
                        status: IN_PROGRESS
                        createdAt: '2026-11-03T09:10:00.000Z'
                        updatedAt: '2026-11-03T09:10:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: 헬스 체크
      description: |
        인증 없이 `select 1`을 실행해 DB 연결 상태를 돌려준다. 정상은 200 `{ "status": "ok", "db": "up" }`, DB 실패는 503 `{ "status": "error", "db": "down" }`이다. 실패 원인은 서버 로그에만 남긴다. 로컬 기동 확인(`curl http://localhost:3000/api/health`)에 쓴다(SO-14, AQ-06, XQ-04, D-07).

        근거: SO-14, SO-07, DL-05, AQ-06, BE-03.
      x-priority: P0
      x-source-ids: [SO-14, SO-07, DL-05, AQ-06, XQ-04, BE-03]
      security: []
      responses:
        '200':
          description: 정상
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                db: up
        '503':
          description: DB 연결 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: error
                db: down

components:
  securitySchemes:
    accessTokenCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: |
        JWT 액세스 토큰(HS384만 허용, 클레임 `sub`·`iat`·`exp`·`jti`, 만료 기본 15분). `HttpOnly; SameSite=Lax; Path=/api; Max-Age=900`(기본값), 운영 HTTPS에서 `Secure`(NFR-07, SO-12).
        쿠키 이름과 `Path`는 가정 (설계서 COM-01에서 확정).
    refreshTokenCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: |
        불투명 리프레시 토큰(32바이트 이상 무작위, DB에는 SHA-256 해시만, 기본 7일 슬라이딩). `HttpOnly; SameSite=Strict; Path=/api/auth; Max-Age=604800`(기본값), 운영 HTTPS에서 `Secure`.
        `Path`는 갱신·로그아웃을 모두 포함하는 인증 API 공통 접두사 하나이며 그 아래의 회원가입·로그인 요청에도 전송되지만 쓰지 않는다(NFR-07, OI-19).
        토큰 갱신과 로그아웃만 읽는다. 쿠키 이름과 `/api/auth` 값은 가정 (설계서 COM-01에서 확정).
    csrfCookie:
      type: apiKey
      in: cookie
      name: csrf_token
      description: |
        Signed Double-Submit의 쿠키 쪽 값(현재 JWT `jti`에 묶어 서버 비밀 키로 HMAC 서명). HttpOnly가 아니다. `SameSite=Lax; Path=/; Max-Age=900`(액세스 수명과 같음, NFR-15, PRD 11장). `COOKIE_DOMAIN`을 설정하면(운영 필수) `Domain=<COOKIE_DOMAIN>`을 붙여 화면 서브도메인의 JS가 읽게 한다. 액세스·리프레시 쿠키에는 Domain이 없다(API 호스트 전용).
        로그인·회원가입·토큰 갱신·비밀번호 변경 때 발급, 로그아웃 때 삭제. 쿠키 이름·`SameSite`·`Path`는 가정 (설계서 COM-01에서 확정, SQ-08).
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        상태 변경 요청(POST·PUT·PATCH·DELETE)에 `csrf_token` 쿠키 값을 그대로 담는다. 쿠키·헤더 일치, 서명, 현재 JWT `jti` 연계 중 하나라도 틀리면 403 `CSRF_FAILED`(ERR-08). 인증(ERR-02)을 먼저 검사한다(DL-05).
        회원가입·로그인·토큰 갱신·로그아웃은 대상이 아니다. 헤더 이름은 가정 (설계서 COM-01에서 확정).

  headers:
    SetCookieSession:
      description: |
        세션 쿠키 3종을 발급한다(Set-Cookie 헤더 3개). 운영 HTTPS에서는 세 쿠키 모두 `Secure`를 붙인다(로컬 HTTP 제외, NFR-07, SO-04).
        - `access_token=<JWT>; Path=/api; HttpOnly; SameSite=Lax; Max-Age=900`
        - `refresh_token=<opaque>; Path=/api/auth; HttpOnly; SameSite=Strict; Max-Age=604800`
        - `csrf_token=<signed>; Path=/; SameSite=Lax; Max-Age=900` (+ `Domain=<COOKIE_DOMAIN>`, 설정 시)

        이름·Path(리프레시 제외)·CSRF SameSite는 가정 (설계서 COM-01에서 확정). Max-Age는 PRD 11장의 기본값(액세스·CSRF 15분, 리프레시 7일)이며 `ACCESS_TOKEN_TTL_MINUTES`·`REFRESH_TOKEN_TTL_DAYS`로 바꿀 수 있다.
      schema:
        type: string
      example: access_token=eyJhbGciOiJIUzM4NCJ9...; Path=/api; HttpOnly; SameSite=Lax; Max-Age=900
    SetCookieClear:
      description: |
        세션 쿠키 3종을 삭제한다(발급 때와 같은 이름·Path, 과거 `Expires`, BR-01, NFR-15). Express 5 `res.clearCookie`는 `Max-Age`를 보내지 않는다.
        - `access_token=; Path=/api; HttpOnly; SameSite=Lax; Expires=Thu, 01 Jan 1970 00:00:00 GMT`
        - `refresh_token=; Path=/api/auth; HttpOnly; SameSite=Strict; Expires=Thu, 01 Jan 1970 00:00:00 GMT`
        - `csrf_token=; Path=/; SameSite=Lax; Expires=Thu, 01 Jan 1970 00:00:00 GMT` (+ 발급 때와 같은 `Domain`, 설정 시)
      schema:
        type: string
      example: refresh_token=; Path=/api/auth; HttpOnly; SameSite=Strict; Expires=Thu, 01 Jan 1970 00:00:00 GMT

  parameters:
    CategoryId:
      name: categoryId
      in: path
      required: true
      description: 카테고리 ID. 없는·다른 사용자의 ID와 uuid 형식 오류는 모두 404 `NOT_FOUND`(BR-02, SO-07).
      schema:
        type: string
        format: uuid
      example: 5a1c2d3e-4f50-4617-8a9b-0c1d2e3f4a5b
    TodoId:
      name: todoId
      in: path
      required: true
      description: 할일 ID. 없는·다른 사용자의 ID와 uuid 형식 오류는 모두 404 `NOT_FOUND`(BR-02, SO-07).
      schema:
        type: string
        format: uuid
      example: 9c8b7a6f-5e4d-4c3b-a2f1-e0d9c8b7a6f5

  schemas:
    Uuid:
      type: string
      format: uuid
      example: 9c8b7a6f-5e4d-4c3b-a2f1-e0d9c8b7a6f5
    DateString:
      type: string
      format: date
      pattern: '^\d{4}-\d{2}-\d{2}$'
      description: 날짜만 의미하는 값. `YYYY-MM-DD` 문자열 그대로이며 시간대 변환을 하지 않는다(CN-06, PRD 4.2).
      example: '2026-11-03'
    Timestamp:
      type: string
      format: date-time
      description: ISO 8601 UTC 시각(CN-06). 화면에서 사용자 시간대로 변환한다(CN-07).
      example: '2026-11-04T05:10:00.000Z'
    Password:
      type: string
      minLength: 8
      maxLength: 128
      format: password
      description: VR-02(KISA 기준). 영대문자·영소문자·숫자·특수문자(공백을 뺀 ASCII 기호) 중 3종류 이상이면 8자 이상, 2종류만이면 10자 이상, 1종류는 거부. 최대 128자, 길이는 UTF-16 코드 단위. 그 밖의 문자(공백·한글 등)는 쓸 수 있지만 종류로 세지 않는다. 앞뒤 공백을 포함해 입력값 그대로 검증·해시한다(PRD 4.1, NFR-06).
    Email:
      type: string
      format: email
      maxLength: 254
      description: VR-01. 필수, 이메일 형식, 최대 254자. 서버가 소문자로 정규화한다.
      example: a@example.com
    Timezone:
      type: string
      minLength: 1
      description: VR-04. IANA 시간대 이름(예 `Asia/Seoul`, `UTC`). 오프셋 형식(`+09:00`)은 거부하고 정규형으로 저장한다(PQ-06).
      example: Asia/Seoul

    User:
      type: object
      description: 사용자(도메인 3장, ER-01). `passwordHash`는 어떤 응답에도 넣지 않는다.
      required: [id, email, name, timezone, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        email:
          $ref: '#/components/schemas/Email'
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: 김민수
        timezone:
          $ref: '#/components/schemas/Timezone'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    SignUpRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'
        name:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '\S'
          description: VR-03. 필수, 공백 제거 뒤 1~50자.
          example: 김민수
        timezone:
          type: string
          description: 브라우저 `Intl.DateTimeFormat().resolvedOptions().timeZone` 감지값. 없거나 VR-04를 통과하지 못하면 오류 없이 `Asia/Seoul`로 저장한다(PRD 4.2, 가입 때만).
          example: Asia/Seoul

    LoginRequest:
      type: object
      required: [email, password]
      description: PRD 4.1 로그인 입력 검증. VR-02의 길이 하한·문자 종류 규칙은 적용하지 않는다(AQ-04).
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128
          description: 필수, 128자 이하. 공백 제거 없음. VR-02에 맞지 않아도 형식 오류가 아니며 틀리면 401 `INVALID_CREDENTIALS`.

    UpdateUserRequest:
      type: object
      minProperties: 1
      description: 보낸 필드만 바꾼다. email은 바꿀 수 없다(OI-03). 아래 필드가 하나도 없으면(모르는 필드만 있어도) 400 `변경할 항목이 없습니다.`이고 `fields`가 없다.
      properties:
        timezone:
          $ref: '#/components/schemas/Timezone'
        name:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '\S'
          description: P1. VR-03. 공백 제거 뒤 1~50자.
          example: 김민지

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          minLength: 1
          description: 현재 비밀번호. 공백 제거 없음. 틀리면 400 `fields[].field = currentPassword`(PRD 4.4).
        newPassword:
          $ref: '#/components/schemas/Password'

    Category:
      type: object
      description: 카테고리(도메인 3장, ER-02). 사용자마다 `isDefault=true`인 '기본' 카테고리가 정확히 1개 있다.
      required: [id, name, isDefault, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          minLength: 1
          maxLength: 30
          example: 업무
        isDefault:
          type: boolean
          description: 기본 카테고리 여부. true면 이름 변경·삭제 불가(BR-05).
          example: false
        createdAt:
          $ref: '#/components/schemas/Timestamp'

    CategoryWithTodoCount:
      allOf:
        - $ref: '#/components/schemas/Category'
        - type: object
          required: [todoCount]
          properties:
            todoCount:
              type: integer
              minimum: 0
              description: 이 카테고리의 할일 수(완료 포함). 삭제 확인 안내용이며 실제 이동 건수와 다를 수 있다(BR-06, AQ-08).
              example: 2

    CategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CategoryWithTodoCount'

    CategoryWriteRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
          pattern: '\S'
          description: VR-07, BR-14. 필수, 공백만 불가, 공백 제거 뒤 1~30자. 같은 사용자 안에서 공백 제거·대소문자 무시로 고유('기본' 포함), 중복은 409.
          example: 업무

    TodoStatus:
      type: string
      enum: [NOT_STARTED, IN_PROGRESS, COMPLETED, OVERDUE]
      description: |
        서버 판정 상태(도메인 4장, 저장하지 않음). `NOT_STARTED`=시작 전, `IN_PROGRESS`=진행 중, `COMPLETED`=완료, `OVERDUE`=기한 초과.
        값 이름은 가정 (설계서 COM-01에서 확정, CN-09). 한국어 표시는 프런트 `statusLabel.ts`가 한다.
      example: IN_PROGRESS

    Todo:
      type: object
      description: 할일(도메인 3장, ER-03). `status`는 응답 때 계산한다.
      required: [id, categoryId, title, description, startDate, endDate, completed, completedAt, status, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        categoryId:
          $ref: '#/components/schemas/Uuid'
        title:
          type: string
          minLength: 1
          maxLength: 100
          example: 기획서 초안 작성
        description:
          type: string
          nullable: true
          maxLength: 1000
          description: 없으면(빈 입력 포함) null(VR-06, EQ-08).
          example: 1장~3장
        startDate:
          $ref: '#/components/schemas/DateString'
        endDate:
          $ref: '#/components/schemas/DateString'
        completed:
          type: boolean
          example: false
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: 완료 표시 시각(UTC). 미완료면 null(BR-13).
          example: null
        status:
          $ref: '#/components/schemas/TodoStatus'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'

    TodoList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: BR-11 고정 정렬(endDate → startDate → createdAt 오름차순).
          items:
            $ref: '#/components/schemas/Todo'

    CreateTodoRequest:
      type: object
      required: [title, startDate, endDate]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '\S'
          description: BR-09, VR-05. 필수, 공백만 불가, 공백 제거 뒤 1~100자.
          example: 기획서 초안 작성
        description:
          type: string
          nullable: true
          maxLength: 1000
          description: VR-06. 선택, 공백 제거 뒤 최대 1000자. 공백 제거 뒤 비면 null로 저장한다.
          example: 1장~3장
        startDate:
          $ref: '#/components/schemas/DateString'
        endDate:
          $ref: '#/components/schemas/DateString'
        categoryId:
          type: string
          format: uuid
          nullable: true
          description: 생략 또는 null이면 기본 카테고리(BR-04). 없는·다른 사용자의 ID는 404.
          example: 5a1c2d3e-4f50-4617-8a9b-0c1d2e3f4a5b

    UpdateTodoRequest:
      type: object
      minProperties: 1
      description: 보낸 필드만 바꾼다. 날짜 순서(BR-07)는 수정 뒤 값으로 검사한다. 아래 필드가 하나도 없으면(모르는 필드만 있어도) 400 `변경할 항목이 없습니다.`이고 `fields`가 없다.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '\S'
          description: BR-09, VR-05.
        description:
          type: string
          nullable: true
          maxLength: 1000
          description: VR-06. null 또는 공백 제거 뒤 빈 값이면 null로 저장한다.
        startDate:
          $ref: '#/components/schemas/DateString'
        endDate:
          $ref: '#/components/schemas/DateString'
        categoryId:
          type: string
          format: uuid
          description: 생략하면 유지. null 불가(가정, SQ-05). 없는·다른 사용자의 ID는 404.
        completed:
          type: boolean
          description: 완료 표시·해제(OI-07). `completedAt`은 서버가 설정·해제한다(BR-13).

    HealthResponse:
      type: object
      required: [status, db]
      properties:
        status:
          type: string
          enum: [ok, error]
        db:
          type: string
          enum: [up, down]

    OkResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    ErrorCode:
      type: string
      enum: [VALIDATION_ERROR, UNAUTHORIZED, INVALID_CREDENTIALS, CONFLICT, NOT_FOUND, TOO_MANY_REQUESTS, INTERNAL_ERROR, CSRF_FAILED]
      description: PRD 4.3 ERR-01~08의 code. 백엔드 `errors.js`, 프런트 `api/errorCodes.ts`의 상수와 같다(CN-05).

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: 요청 필드 이름(camelCase, 프런트 폼 필드 이름과 같음, CN-08).
          example: endDate
        message:
          type: string
          description: 한국어 사유. 프런트가 입력란 아래에 그대로 표시한다.
          example: 종료일은 시작일 이후여야 합니다.

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: 한국어 메시지. 클라이언트는 이 문자열로 분기하지 않는다(PR-08). 스택·SQL 등 내부 정보는 넣지 않는다(SO-07).
            fields:
              type: array
              description: ERR-01일 때 필드별 사유. 다른 code에서는 없다.
              items:
                $ref: '#/components/schemas/FieldError'

  responses:
    ValidationError:
      description: ERR-01 `VALIDATION_ERROR` - 입력 검증 실패, 기본 카테고리 삭제·이름 변경, 현재 비밀번호 불일치, 로그인 형식 위반, 잘못된 시간대·필터·기간, 요청 본문 형식 오류(잘못된 JSON·크기 초과·지원하지 않는 문자셋)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            dateOrder:
              summary: 시작일 > 종료일 (AC-06)
              value:
                error:
                  code: VALIDATION_ERROR
                  message: 입력값을 확인해 주세요.
                  fields:
                    - field: endDate
                      message: 종료일은 시작일 이후여야 합니다.
    Unauthorized:
      description: ERR-02 `UNAUTHORIZED` - 액세스 토큰 없음·만료·위조, 또는 갱신 시 리프레시 토큰 없음·만료·폐기·재사용. 클라이언트 처리는 info 공통 규약 참조.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              value:
                error:
                  code: UNAUTHORIZED
                  message: 로그인이 필요합니다.
    InvalidCredentials:
      description: ERR-03 `INVALID_CREDENTIALS` - 로그인 실패. 없는 email과 틀린 비밀번호가 같은 본문이다(AC-14).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalid:
              value:
                error:
                  code: INVALID_CREDENTIALS
                  message: 이메일 또는 비밀번호가 올바르지 않습니다.
    CsrfFailed:
      description: ERR-08 `CSRF_FAILED` - CSRF 헤더 없음, 쿠키·헤더 불일치, 서명 오류, 다른 JWT에 묶인 토큰(NFR-15)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            csrf:
              value:
                error:
                  code: CSRF_FAILED
                  message: 요청을 확인할 수 없습니다. 페이지를 새로고침해 주세요.
    NotFound:
      description: ERR-05 `NOT_FOUND` - 없는 리소스, 다른 사용자의 리소스, 다른 사용자의(또는 없는) categoryId, uuid 형식 오류. 경우를 구분하지 않는다(BR-02, SO-07).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              value:
                error:
                  code: NOT_FOUND
                  message: 대상을 찾을 수 없습니다.
    Conflict:
      description: ERR-04 `CONFLICT` - email 중복(VR-01) 또는 같은 사용자 안 카테고리 이름 중복(BR-14)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            duplicateEmail:
              value:
                error:
                  code: CONFLICT
                  message: 이미 사용 중인 이메일입니다.
                  fields:
                    - field: email
                      message: 이미 사용 중인 이메일입니다.
            duplicateCategory:
              value:
                error:
                  code: CONFLICT
                  message: 이미 있는 카테고리 이름입니다.
                  fields:
                    - field: name
                      message: 이미 있는 카테고리 이름입니다.
    TooManyRequests:
      description: |
        ERR-06 `TOO_MANY_REQUESTS` - 로그인 실패 제한 중(NFR-10, AC-15). 비밀번호를 검증하지 않고 거부하며 이 거부는 실패 횟수에 넣지 않는다.
        시간 창이 지나면 풀린다. `Retry-After` 헤더는 문서에 없어 보내지 않는다(SQ-03).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            limited:
              value:
                error:
                  code: TOO_MANY_REQUESTS
                  message: 로그인 시도가 너무 많습니다. 잠시 후 다시 시도해 주세요.
    InternalError:
      description: ERR-07 `INTERNAL_ERROR` - 서버 내부 오류. 고정 문구이며 내부 정보는 넣지 않는다(SO-07, NFR-11).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            internal:
              value:
                error:
                  code: INTERNAL_ERROR
                  message: 일시적인 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.

  examples:
    UserExample:
      value:
        id: 3f2b8c1e-9a4d-4b7e-8f21-6c5d4e3a2b10
        email: a@example.com
        name: 김민수
        timezone: Asia/Seoul
        createdAt: '2026-11-03T09:00:00.000Z'
        updatedAt: '2026-11-03T09:00:00.000Z'
    CategoryExample:
      value:
        id: 5a1c2d3e-4f50-4617-8a9b-0c1d2e3f4a5b
        name: 업무
        isDefault: false
        createdAt: '2026-11-03T09:05:00.000Z'
    TodoExample:
      value:
        id: 9c8b7a6f-5e4d-4c3b-a2f1-e0d9c8b7a6f5
        categoryId: 5a1c2d3e-4f50-4617-8a9b-0c1d2e3f4a5b
        title: 기획서 초안 작성
        description: 1장~3장
        startDate: '2026-11-03'
        endDate: '2026-11-05'
        completed: false
        completedAt: null
        status: IN_PROGRESS
        createdAt: '2026-11-03T09:10:00.000Z'
        updatedAt: '2026-11-03T09:10:00.000Z'
    OkExample:
      value:
        status: ok
