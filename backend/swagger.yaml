    개발 환경(`NODE_ENV=development`)에서만 `http://localhost:3000/api/docs`(Swagger UI)와 `/api/docs/swagger.yaml`로 이 명세를 볼 수 있다. 운영·테스트 환경에는 이 경로가 없다.

