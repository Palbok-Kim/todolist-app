    이력 갱신 규칙: 파일 상단 주석 표와 이 표를 함께 갱신한다. SemVer(호환 깨짐 major, 엔드포인트·필드 추가 minor, 설명 수정 patch).

    ## 공통 규약

    - **경로**: 모든 경로는 `/api` 접두사 아래다(PQ-05, SO-14). `servers[].url`에 `/api`를 포함하고 `paths`에는 접두사를 쓰지 않는다.
    - **JSON 필드**: camelCase(CN-04). `*Date`는 `YYYY-MM-DD` 문자열이고 시간대 변환을 하지 않는다. `*At`은 ISO 8601 UTC 문자열이다(CN-06, PRD 4.2, 6장).
    - **ID**: 모두 uuid. uuid 형식이 아닌 경로·본문·쿼리의 ID는 DB에 보내기 전에 404 `NOT_FOUND`(ERR-05)로 응답한다(SO-07). 예외: 본문 `categoryId`가 빈 문자열·공백만·문자열이 아닌 값이면 입력 누락으로 보고 400이다. 다른 사용자의 리소스와 없는 리소스는 구분하지 않고 같은 404다(BR-02).
    - **문자열 검증**: 앞뒤 공백을 제거한 뒤 검증한다(PRD 4.1). 길이 제약(`minLength`·`maxLength`)도 공백 제거 뒤 기준이다. **비밀번호는 어떤 공백 제거도 하지 않는다.** 서버 검증이 최종 판정이다(PR-05).
    - **본문 형식 오류**: 잘못된 JSON·크기 초과(413)·지원하지 않는 문자셋(415) 본문은 모든 경로에서 인증보다 먼저 400 `VALIDATION_ERROR`(`요청 형식이 올바르지 않습니다.`, `fields` 없음)이다. 각 operation의 응답 목록에는 따로 적지 않는다.
    - **오류**: 모든 오류는 `{ "error": { "code", "message", "fields?" } }`(PRD 4.3). 클라이언트는 `error.code`로만 분기한다(PR-08). `message`·`fields[].message`는 한국어다(CN-08).
    - **목록**: 페이지네이션 없이 전체를 `{ "items": [...] }`로 돌려준다(OI-15). 필드로 감싼 이유는 나중에 페이지 정보를 하위 호환으로 추가하기 위함이다(가정).
    - **인증**: 액세스 토큰(JWT HS384, 기본 15분 `ACCESS_TOKEN_TTL_MINUTES`)은 HttpOnly 쿠키, 리프레시 토큰(불투명 값, 기본 7일 슬라이딩 `REFRESH_TOKEN_TTL_DAYS`, 회전·재사용 감지·폐기 후 10초 유예)은 경로 한정 HttpOnly 쿠키다(NFR-07). 요청 헤더 `Authorization`은 쓰지 않는다.
    - **CORS**: 화면과 API는 다른 출처다(운영은 같은 사이트의 다른 서브도메인). 환경 변수 `CORS_ORIGINS`에 적은 출처만 `Access-Control-Allow-Origin`(그 출처 그대로)·`Access-Control-Allow-Credentials: true`를 받는다. `*`는 쓰지 않는다. 사전 요청(OPTIONS)은 인증·CSRF 전에 204로 응답하고 허용 출처에만 `GET, POST, PUT, PATCH, DELETE`와 `Content-Type, X-CSRF-Token` 헤더를 허용한다. 클라이언트는 `credentials: 'include'`로 호출한다.
    - **CSRF**: POST·PUT·PATCH·DELETE는 Signed Double-Submit(쿠키 값 = 헤더 값, HMAC 서명, 현재 JWT `jti` 연계)을 요구한다(NFR-15). 예외: 회원가입·로그인·토큰 갱신·로그아웃.
    - **검사 순서**: 인증(401 ERR-02) → CSRF(403 ERR-08) → 검증(400) → 소유권(404)(DL-05, AD-08). 예외: `/todos/{todoId}`의 GET·PATCH·DELETE는 경로 ID 형식 오류를 본문 검증보다 먼저 404로 응답한다. 액세스 토큰이 만료된 상태 변경 요청은 ERR-02이고 저장되지 않으므로, 클라이언트는 `POST /auth/refresh` 뒤 원 요청을 한 번만 재전송한다(DL-14).
    - **ERR-02 클라이언트 처리**: 보호 API가 401을 받으면 갱신을 한 번(single-flight) 시도하고, 성공·실패와 관계없이 원 요청을 한 번만 재전송한 뒤에도 401이면 로그인을 요구한다(PRD 4.3 ERR-02, NFR-07, DL-14).

    ## 할일 상태(status)

    저장하지 않고 조회 때 서버가 `User.timezone` 기준 오늘로 계산한다(도메인 4장, PR-06, DL-09). 판정 순서: 완료 → 기한 초과 → 시작 전 → 진행 중.

    | 값 | 도메인 4장 상태 | 조건 |
    |----|----------------|------|
    | `COMPLETED` | 완료 | `completed = true` |
    | `OVERDUE` | 기한 초과 | `completed = false` 이고 오늘 > `endDate` |
    | `NOT_STARTED` | 시작 전 | `completed = false` 이고 오늘 < `startDate` |
    | `IN_PROGRESS` | 진행 중 | `completed = false` 이고 `startDate` ≤ 오늘 ≤ `endDate` |

    값 이름은 CN-09·8-plan.md BE-19의 상수를 따랐다(가정, 설계서 COM-01에서 확정).

    ## 오류 코드 카탈로그 (PRD 4.3)

    | ID | code | HTTP | 대표 상황 |
    |----|------|------|-----------|
    | ERR-01 | `VALIDATION_ERROR` | 400 | 입력 검증 실패, 기본 카테고리 삭제·이름 변경, 현재 비밀번호 불일치, 로그인 형식 위반, 잘못된 시간대·필터·기간, 요청 본문 형식 오류(잘못된 JSON·크기 초과·지원하지 않는 문자셋, `fields` 없음) |
    | ERR-02 | `UNAUTHORIZED` | 401 | 액세스 토큰 없음·만료·위조, 갱신 시 리프레시 토큰 없음·만료·폐기·재사용 |
    | ERR-03 | `INVALID_CREDENTIALS` | 401 | 로그인 실패(email 존재 여부와 무관하게 같은 문구) |
    | ERR-04 | `CONFLICT` | 409 | email 중복, 같은 사용자 안 카테고리 이름 중복 |
    | ERR-05 | `NOT_FOUND` | 404 | 없는 리소스, 다른 사용자의 리소스, 다른 사용자의(또는 없는) categoryId, uuid 형식 오류 |
    | ERR-06 | `TOO_MANY_REQUESTS` | 429 | 로그인 실패 제한 중의 로그인 시도 |
    | ERR-07 | `INTERNAL_ERROR` | 500 | 서버 내부 오류(내부 정보 미포함) |
    | ERR-08 | `CSRF_FAILED` | 403 | 상태 변경 요청의 CSRF 검증 실패 |

    ## 새로 둔 가정 (설계서 COM-01에서 확정)

    | 항목 | 이 명세의 값 | 근거 |
    |------|--------------|------|
    | 개발 서버 주소 | `http://localhost:3000/api` (백엔드 직접 호출, 화면 `http://localhost:5173`에서 CORS) | PRD 6장, SO-08 |
    | 경로 | `/auth/*`, `/users/me`, `/users/me/password`, `/categories`, `/todos`, `/calendar/todos`, `/health` | PQ-05, SO-14 |
    | 쿠키 이름 | `access_token`, `refresh_token`, `csrf_token` | PRD 11장, SO-12 |
    | CSRF 헤더 이름 | `X-CSRF-Token` | PRD 11장 |
    | 쿠키 `Path` | 액세스 `/api`, 리프레시 `/api/auth`(인증 API 공통 접두사, OI-19), CSRF `/`(화면 스크립트가 읽어야 함) | NFR-07, OI-19 |
    | CSRF 쿠키 `SameSite` | `Lax` | 문서 없음 |
    | 캘린더 파라미터 이름 | `from`, `to` (8-plan.md BE-20) | PRD 11장, AQ-07 |
    | 오류 `fields` 형태 | `[{ "field", "message" }]` | PRD 4.3, CN-08 |
    | 성공 본문 | 로그아웃·갱신·비밀번호 변경은 200 `{ "status": "ok" }`, 삭제는 204 | 8-plan.md BE-13·BE-24(200) |
    | 완료 표시·해제 | 별도 엔드포인트 없이 `PATCH /todos/{todoId}`의 `completed` | OI-07, FR-07, BE-18 |
    | 카테고리 목록 정렬 | 기본 카테고리 먼저, 그다음 `createdAt` 오름차순 | 문서 없음 |

    ## 확인 필요 (SQ)

    - **SQ-01 캘린더 파라미터 이름**: 8-plan.md BE-20은 `from`·`to`를 쓰고, CN-06은 'YYYY-MM-DD 문자열은 `*Date`(캘린더 범위 포함)'라고 한다. 추천: BE-20을 따라 `from`·`to`로 두고 CN-06의 `*Date` 규칙은 JSON 필드에만 적용한다고 명시한다. (반대로 정하면 `fromDate`·`toDate`.)
    - **SQ-02 기간 42일 계산 기준**: PRD 11장 '기간이 42일을 넘는 경우 ERR-01'이 양 끝 포함 일수인지 불명하다. 월간 그리드 6주 = 42칸이므로 추천: 양 끝 포함 42일 이하 허용(`to - from ≤ 41일`). 8-plan.md BE-20 완료 조건에는 42일 검사가 없어 테스트 추가가 필요하다.
    - **SQ-03 로그인 제한 응답의 Retry-After**: NFR-10·ERR-06·WF-01(남은 시간 미표시)은 `Retry-After` 헤더를 정하지 않았다. 추천: MVP에서는 보내지 않는다(화면이 쓰지 않고 제한기 상태를 드러내지 않음). 필요해지면 minor 버전으로 추가한다.
    - **SQ-04 로그아웃·갱신 성공 상태 코드**: 8-plan.md BE-13·BE-24 완료 조건이 200을 적어 200 `{ "status": "ok" }`로 두었다. 본문이 필요 없으므로 204도 가능하다. 추천: 계획서와 맞춰 200 유지.
    - **SQ-05 할일 수정의 categoryId=null**: BR-04(미지정 시 기본)는 UC-05·UC-07 모두 적용이라고 하나, 부분 수정(PATCH)에서 '미지정'이 '생략(유지)'인지 'null(기본으로 이동)'인지 문서에 없다. 추천: 생략은 유지, null은 허용하지 않음(400). 화면 드롭다운은 빈 선택지가 없다(PRD 7장).
    - **SQ-06 카테고리 목록 정렬**: WF-08·WF-04 드롭다운·WF-03 필터의 순서가 문서에 없다. 추천: 기본 카테고리 먼저, 그다음 `createdAt` 오름차순.
    - **SQ-07 헬스 실패 응답**: 확정(사용자 요청 2026-11-05, SO-14 v0.11). DB 연결 실패는 503 `{ "status": "error", "db": "down" }`이고 ERR 형식이 아니다. 기동 확인은 `curl`로 2xx만 성공으로 본다(9-design.md D-07).
    - **SQ-08 CSRF·액세스 쿠키의 Path·SameSite**: NFR-07·SO-12는 리프레시 쿠키 Path만 한정하고 CSRF 쿠키의 `SameSite`·`Path`는 정하지 않았다. 추천: 표의 가정값.
    - **SQ-09 PRD 4.3 표의 구분**: ERR 표 전체가 '가정'이지만 8-plan.md의 테스트가 code·HTTP 값에 의존한다. 추천: 설계서에서 확정으로 전환.
